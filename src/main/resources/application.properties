# Emri i aplikacionit
spring.application.name=katalog

# Lexo fjalëkalimet nga skedari .env në root (nëse mungon, aplikacioni prapë niset)
spring.config.import=optional:file:.env[.properties]

# Lidhja me PostgreSQL në Docker (porti 5433 në kompjuter)
spring.datasource.url=jdbc:postgresql://localhost:5433/katalog
spring.datasource.username=katalog
spring.datasource.password=${DB_PASSWORD}

# JPA: krijo ose përditëso tabelat sipas entiteteve dhe shfaq SQL-in në konsolë
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Sesioni mbahet vetëm me cookie, jo me ;jsessionid në URL
server.servlet.session.tracking-modes=cookie