<!DOCTYPE html>
<!-- Një formë për krijim dhe ndryshim: id == null do të thotë instruktor i ri -->
<html lang="sq" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: layout(~{::title}, ~{::main})}">
<head>
    <title th:text="${instructor.id == null} ? 'Instruktor i ri' : 'Ndrysho instruktorin'">Instruktori</title>
</head>
<body>
<main>
    <h1 th:text="${instructor.id == null} ? 'Instruktor i ri' : 'Ndrysho instruktorin'">Instruktori</h1>

    <div class="card">
        <!-- novalidate: validimin e bën serveri, jo shfletuesi -->
        <form method="post" novalidate th:object="${instructor}"
              th:action="${instructor.id == null} ? @{/instructors} : @{/instructors/{id}/edit(id=${instructor.id})}">
            <div class="form-grid">
                <div class="form-group">
                    <label for="firstName">Emri</label>
                    <input type="text" th:field="*{firstName}" th:errorclass="invalid">
                    <span class="error" th:if="${#fields.hasErrors('firstName')}" th:errors="*{firstName}">Gabim</span>
                </div>

                <div class="form-group">
                    <label for="lastName">Mbiemri</label>
                    <input type="text" th:field="*{lastName}" th:errorclass="invalid">
                    <span class="error" th:if="${#fields.hasErrors('lastName')}" th:errors="*{lastName}">Gabim</span>
                </div>

                <div class="form-group">
                    <label for="email">E-maili</label>
                    <input type="email" th:field="*{email}" th:errorclass="invalid">
                    <span class="error" th:if="${#fields.hasErrors('email')}" th:errors="*{email}">Gabim</span>
                </div>

                <div class="form-group">
                    <label for="expertise">Ekspertiza (opsionale)</label>
                    <input type="text" th:field="*{expertise}" th:errorclass="invalid">
                    <span class="error" th:if="${#fields.hasErrors('expertise')}" th:errors="*{expertise}">Gabim</span>
                </div>
            </div>

            <div class="form-buttons">
                <button type="submit" class="btn btn-primary">Ruaj</button>
                <a class="btn btn-light" th:href="@{/instructors}">Anulo</a>
            </div>
        </form>
    </div>
</main>
</body>
</html>
