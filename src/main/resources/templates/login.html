<!DOCTYPE html>
<html lang="sq" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: layout(~{::title}, ~{::main})}">
<head>
    <title>Hyr</title>
</head>
<body>
<main class="auth">
    <h1>Hyr</h1>

    <div class="alert alert-error" th:if="${param.error}">Përdoruesi ose fjalëkalimi është gabim.</div>
    <div class="alert alert-success" th:if="${param.logout}">U çkyçët me sukses.</div>

    <div class="card">
        <form method="post" th:action="@{/login}">
            <div class="form-grid">
                <div class="form-group full">
                    <label for="username">Përdoruesi</label>
                    <input type="text" id="username" name="username" autocomplete="username" required autofocus>
                </div>

                <div class="form-group full">
                    <label for="password">Fjalëkalimi</label>
                    <input type="password" id="password" name="password" autocomplete="current-password" required>
                </div>
            </div>

            <div class="form-buttons">
                <button type="submit" class="btn btn-primary">Hyr</button>
            </div>
        </form>
    </div>
</main>
</body>
</html>
