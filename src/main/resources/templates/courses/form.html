<!DOCTYPE html>
<!-- Një formë për krijim dhe ndryshim: id == null do të thotë kurs i ri -->
<html lang="sq" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: layout(~{::title}, ~{::main})}">
<head>
    <title th:text="${course.id == null} ? 'Kurs i ri' : 'Ndrysho kursin'">Kursi</title>
</head>
<body>
<main>
    <h1 th:text="${course.id == null} ? 'Kurs i ri' : 'Ndrysho kursin'">Kursi</h1>

    <div class="card">
        <!-- novalidate: validimin e bën serveri, jo shfletuesi -->
        <form method="post" novalidate th:object="${course}"
              th:action="${course.id == null} ? @{/courses} : @{/courses/{id}/edit(id=${course.id})}">
            <div class="form-grid">
                <div class="form-group full">
                    <label for="title">Titulli</label>
                    <input type="text" th:field="*{title}" th:errorclass="invalid">
                    <span class="error" th:if="${#fields.hasErrors('title')}" th:errors="*{title}">Gabim</span>
                </div>

                <div class="form-group">
                    <label for="category">Kategoria</label>
                    <select th:field="*{category}" th:errorclass="invalid">
                        <option value="">-- Zgjidh kategorinë --</option>
                        <option th:each="category : ${categories}"
                                th:value="${category}" th:text="${category.displayName}">Programim</option>
                    </select>
                    <span class="error" th:if="${#fields.hasErrors('category')}" th:errors="*{category}">Gabim</span>
                </div>

                <!-- Vlera e opsionit është id-ja; InstructorConverter e kthen në Instructor.
                     th:selected krahason id-të, që te ndryshimi instruktori aktual të dalë i zgjedhur. -->
                <div class="form-group">
                    <label for="instructor">Instruktori</label>
                    <select id="instructor" name="instructor"
                            th:classappend="${#fields.hasErrors('instructor')} ? 'invalid'">
                        <option value="">-- Zgjidh instruktorin --</option>
                        <option th:each="instructor : ${instructors}"
                                th:value="${instructor.id}"
                                th:text="${instructor.fullName}"
                                th:selected="${course.instructor != null and course.instructor.id == instructor.id}">Arta Krasniqi</option>
                    </select>
                    <span class="error" th:if="${#fields.hasErrors('instructor')}" th:errors="*{instructor}">Gabim</span>
                </div>

                <div class="form-group">
                    <label for="price">Çmimi (€)</label>
                    <input type="number" step="0.01" th:field="*{price}" th:errorclass="invalid">
                    <span class="error" th:if="${#fields.hasErrors('price')}" th:errors="*{price}">Gabim</span>
                </div>

                <div class="form-group">
                    <label for="capacity">Kapaciteti</label>
                    <input type="number" th:field="*{capacity}" th:errorclass="invalid">
                    <span class="error" th:if="${#fields.hasErrors('capacity')}" th:errors="*{capacity}">Gabim</span>
                </div>

                <div class="form-group">
                    <label for="startDate">Data e fillimit</label>
                    <input type="date" th:field="*{startDate}" th:errorclass="invalid">
                    <span class="error" th:if="${#fields.hasErrors('startDate')}" th:errors="*{startDate}">Gabim</span>
                </div>

                <div class="form-group">
                    <label for="endDate">Data e mbarimit</label>
                    <input type="date" th:field="*{endDate}" th:errorclass="invalid">
                    <span class="error" th:if="${#fields.hasErrors('endDate')}" th:errors="*{endDate}">Gabim</span>
                </div>

                <div class="form-group full">
                    <label for="description">Përshkrimi (opsional)</label>
                    <textarea rows="5" th:field="*{description}" th:errorclass="invalid"></textarea>
                    <span class="error" th:if="${#fields.hasErrors('description')}" th:errors="*{description}">Gabim</span>
                </div>
            </div>

            <div class="form-buttons">
                <button type="submit" class="btn btn-primary">Ruaj</button>
                <a class="btn btn-light" th:href="@{/courses}">Anulo</a>
            </div>
        </form>
    </div>
</main>
</body>
</html>
