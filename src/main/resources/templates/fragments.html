<!DOCTYPE html>
<!-- Copat e përbashkëta që i përdor layout.html -->
<html lang="sq" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<body>

<!-- Shiriti blu lart me emrin dhe lidhjet -->
<header class="navbar" th:fragment="navbar">
    <a class="brand" th:href="@{/courses}">Katalog kursesh</a>
    <nav sec:authorize="isAuthenticated()">
        <a th:href="@{/courses}">Kurset</a>
        <a th:href="@{/instructors}">Instruktorët</a>
        <span class="user-name" sec:authentication="name"></span>
        <form method="post" th:action="@{/logout}">
            <button type="submit" class="btn btn-light btn-small">Dil</button>
        </form>
    </nav>
</header>

<!-- Mesazhet flash: shfaqen vetëm kur controller-i i ka dërguar -->
<div th:fragment="messages">
    <div class="alert alert-success" th:if="${successMessage}" th:text="${successMessage}">Sukses</div>
    <div class="alert alert-error" th:if="${errorMessage}" th:text="${errorMessage}">Gabim</div>
</div>

<!-- Pjesa e poshtme e faqes -->
<footer class="footer" th:fragment="footer">
    <p>Katalog kursesh · Projekt për lëndën Zhvillim i Web-it - Prof. Jon Kursani</p>
</footer>

</body>
</html>
